<style>
:root{
  --disp:"Poppins","Trebuchet MS",system-ui,sans-serif;
  --ui:"Poppins",system-ui,sans-serif;
  --plakat:"Silkscreen",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#1c0b06;color:#fff3f8;font-family:var(--ui);overflow:hidden;touch-action:none}
#buehne{
  /* Etwas oberhalb der Mitte: unten mehr Luft lassen, dann rutscht das Bild hoch */
  position:fixed;
  top:env(safe-area-inset-top,0px);right:0;
  bottom:calc(env(safe-area-inset-bottom,0px) + 96px);left:0;
  display:grid;place-items:center;
}
#film{display:block;background:#1c0b06;box-shadow:0 0 60px rgba(0,0,0,.8)}

#start{
  position:fixed;inset:0;display:grid;place-items:center;padding:24px;z-index:5;
  background:radial-gradient(120% 90% at 50% 20%,#a63614,#2a0604 72%);
}
#start[hidden]{display:none!important}
.karte{
  max-width:420px;text-align:center;padding:30px 26px;border-radius:26px;
  background:linear-gradient(165deg,#ffdca8,#f5912f 46%,#e2621c);color:#3d0f2b;
  box-shadow:0 24px 60px rgba(0,0,0,.6), inset 0 3px 0 rgba(255,255,255,.6);
}
.karte h1{font-family:var(--disp);font-weight:800;font-size:32px;margin:0;letter-spacing:-.03em}
.karte p{font-size:14.5px;line-height:1.55;margin:12px 0 0;color:#4a1234}
.karte ol{text-align:left;font-family:var(--ui);font-size:11.5px;line-height:1.8;
  margin:14px 0 0;padding-left:20px;color:#521538}
#ab{
  margin-top:20px;cursor:pointer;border:none;border-radius:14px;padding:15px 34px;
  font-family:var(--disp);font-weight:800;font-size:19px;color:#ffe3c4;
  background:linear-gradient(170deg,#8f2b12,#2a0604);box-shadow:0 7px 0 #1a0402;
}
#ab:active{transform:translateY(4px);box-shadow:0 3px 0 #1a0402}
#nochmal{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:4;
  cursor:pointer;border:none;border-radius:11px;padding:10px 22px;opacity:0;
  font-family:var(--disp);font-weight:800;font-size:14px;color:#3d0f2b;
  background:linear-gradient(170deg,#ffdca8,#e2621c);
  transition:opacity .4s;pointer-events:none;
}
#nochmal.da{opacity:.92;pointer-events:auto}
</style>

<div id="buehne"><canvas id="film"></canvas></div>
<button id="nochmal" type="button">Nochmal abspielen</button>

<div id="start">
  <div class="karte">
    <h1>Einladung aufnehmen</h1>
    <p>21 Sekunden, Hochformat 9:16, mit Ton — Polly spricht direkt in die Kamera.</p>
    <ol>
      <li>Bildschirmaufnahme am Telefon starten</li>
      <li>Lautlos-Schalter am Rand ausschalten, sonst bleibt es stumm</li>
      <li>Hier auf Abspielen tippen</li>
      <li>Nach dem letzten Bild Aufnahme stoppen</li>
    </ol>
    <button id="ab" type="button">Abspielen</button>
  </div>
</div>

<script>
(() => {

const BREIT = 1080, HOCH = 1920;

const GLIMMER_ORANGE = "#ea6412";
const GLIMMER_CREME  = "#f7e7c4";
function funkel(c, x, y, r, dreh, farbe, dick) {
  c.save(); c.translate(x, y); c.rotate(dreh || 0);
  c.beginPath();
  c.moveTo(0, -r);
  c.quadraticCurveTo(r*0.11, -r*0.11, r, 0);
  c.quadraticCurveTo(r*0.11, r*0.11, 0, r);
  c.quadraticCurveTo(-r*0.11, r*0.11, -r, 0);
  c.quadraticCurveTo(-r*0.11, -r*0.11, 0, -r);
  c.closePath();
  c.strokeStyle = farbe; c.lineWidth = dick || Math.max(1.2, r*0.065);
  c.lineJoin = "round"; c.stroke();
  c.restore();
}

function rundRect(c, x, y, w, h, r) {
  const rr = Math.min(r, w/2, h/2);
  c.beginPath();
  c.moveTo(x+rr, y); c.arcTo(x+w, y, x+w, y+h, rr);
  c.arcTo(x+w, y+h, x, y+h, rr); c.arcTo(x, y+h, x, y, rr);
  c.arcTo(x, y, x+w, y, rr); c.closePath();
}

// Das Haus ist Klinker. Zwischen Plastikschale und Raeumen liegt das Mauerwerk.
function klinkerband(x1, y1, x2, y2) {
  const d = 16;
  const ring = new Path2D();
  ring.rect(x1 - d, y1 - d, (x2 - x1) + d*2, (y2 - y1) + d*2);
  ring.rect(x1, y1, x2 - x1, y2 - y1);
  cx.save();
  cx.clip(ring, "evenodd");
  const g = cx.createLinearGradient(0, y1 - d, 0, y2 + d);
  g.addColorStop(0, "#b05e42"); g.addColorStop(.55, "#8e4634"); g.addColorStop(1, "#653125");
  cx.fillStyle = g;
  cx.fillRect(x1 - d, y1 - d, (x2 - x1) + d*2, (y2 - y1) + d*2);
  // Ziegellagen
  cx.strokeStyle = "rgba(255,226,206,.16)"; cx.lineWidth = 1;
  for (let y = y1 - d + 4; y < y2 + d; y += 5) {
    cx.beginPath(); cx.moveTo(x1 - d, y); cx.lineTo(x2 + d, y); cx.stroke();
  }
  cx.restore();
  // Kante zur Schale
  cx.strokeStyle = "rgba(48,20,14,.5)"; cx.lineWidth = 2;
  cx.strokeRect(x1 - d, y1 - d, (x2 - x1) + d*2, (y2 - y1) + d*2);
}

/* Der Oberhafen suedlich der Stockmeyerstrasse, von oben gesehen:
   Gleis, Kai mit Containerbruecken und Stapeln, dann der Kanal mit dem Frachter.
   Dieselben Zutaten wie im Trailer, nur aus der Vogelperspektive. */
const GLEIS_Y = 784, GLEIS_H = 42;      // Schotter und Schienen
const KAI_Y   = 826, KAI_H   = 50;      // Kaiflaeche mit Kraenen und Containern
const WASSER_Y = 876;                   // ab hier Wasser
const HAF_X1 = -420, HAF_X2 = 2180;

// Schotter, Schwellen und Schienen aendern sich nie: einmal malen, dann nur noch kopieren.
let gleisBild = null;
function gleis() {
  if (!gleisBild) {
    const b = HAF_X2 - HAF_X1, f = 2;
    gleisBild = document.createElement("canvas");
    gleisBild.width = b * f; gleisBild.height = GLEIS_H * f;
    const g = gleisBild.getContext("2d");
    g.scale(f, f);
    g.fillStyle = "#2c2438"; g.fillRect(0, 0, b, GLEIS_H);
    g.fillStyle = "rgba(255,243,248,.06)";
    for (let i = 0; i < 300; i++) {
      g.fillRect((i * 97.3) % b, 3 + ((i * 29.7) % (GLEIS_H - 7)), 2, 2);
    }
    g.fillStyle = "rgba(58,40,32,.8)";
    for (let x = 0; x < b; x += 17) g.fillRect(x, 6, 9, GLEIS_H - 13);
    g.strokeStyle = "rgba(214,200,232,.45)"; g.lineWidth = 3;
    for (const y of [13, 29]) {
      g.beginPath(); g.moveTo(0, y); g.lineTo(b, y); g.stroke();
    }
  }
  cx.drawImage(gleisBild, HAF_X1, GLEIS_Y, HAF_X2 - HAF_X1, GLEIS_H);
}

/* Der Kanal mit Wellen, Lichtern und dem Frachter */
function wasser() {
  const wg = cx.createLinearGradient(0, WASSER_Y, 0, WASSER_Y + 330);
  wg.addColorStop(0, "#15294c"); wg.addColorStop(1, "#0b1122");
  cx.fillStyle = wg; cx.fillRect(HAF_X1, WASSER_Y, HAF_X2 - HAF_X1, 480);

  // Der Club wirft seinen Schein aufs Wasser
  const sp = cx.createRadialGradient(860, WASSER_Y, 10, 860, WASSER_Y, 320);
  sp.addColorStop(0, "rgba(234,100,18,.14)"); sp.addColorStop(1, "rgba(234,100,18,0)");
  cx.fillStyle = sp; cx.fillRect(HAF_X1, WASSER_Y, HAF_X2 - HAF_X1, 400);

  // Kraeuselung, die immer wieder abreisst
  cx.lineWidth = 2; cx.lineCap = "round";
  for (let i = 0, y = WASSER_Y + 12; y < WASSER_Y + 330; i++, y += 17 + (i % 3) * 9) {
    cx.strokeStyle = `rgba(178,204,255,${0.05 + (i % 3) * 0.022})`;
    let auf = false; cx.beginPath();
    for (let x = HAF_X1; x <= HAF_X2; x += 34) {
      if (Math.sin(x * 0.013 + i * 2.1) < -0.45) { auf = false; continue; }
      const v = Math.sin(S.t * 0.8 + x * 0.009 + i * 1.3) * 8;
      auf ? cx.lineTo(x, y + v) : cx.moveTo(x, y + v);
      auf = true;
    }
    cx.stroke();
  }
  cx.lineCap = "butt";

  for (let i = 0; i < 26; i++) {                  // Lichtpunkte
    const gx = -300 + ((i * 197.3) % 2300);
    const gy = WASSER_Y + 20 + ((i * 71.7) % 300);
    const fl = Math.max(0, Math.sin(S.t * 1.6 + i * 1.9));
    if (fl > 0.4) {
      cx.fillStyle = `rgba(255,214,150,${0.3 * fl})`;
      cx.fillRect(gx, gy, 5 + fl * 5, 2);
    }
  }

  // Das andere Ufer, weit hinten
  cx.fillStyle = "#241c3c";
  cx.fillRect(HAF_X1, 1150, HAF_X2 - HAF_X1, 260);
  for (let i = 0, x = HAF_X1; x < HAF_X2; i++) {
    const b = 90 + ((i * 53) % 130), h = 24 + ((i * 37) % 54);
    cx.fillRect(x, 1150 - h, b, h + 4);
    x += b + 10 + ((i * 29) % 30);
  }
  for (let i = 0; i < 24; i++) {
    const lx = -360 + ((i * 213) % 2500);
    const fl = 0.45 + 0.55 * Math.abs(Math.sin(S.t * 1.4 + i));
    cx.fillStyle = `rgba(255,190,110,${0.8 * fl})`;
    cx.fillRect(lx, 1142, 5, 5);
  }

  frachter(812, 890);
}

/* Ein Frachter liegt laengsseits, Bug nach Westen */
function frachter(x, y0) {
  const L = 430, B = 44;
  const y = y0 + Math.sin(S.t * 0.5) * 2.5;
  cx.save();
  cx.shadowColor = "rgba(0,0,0,.5)"; cx.shadowBlur = 18; cx.shadowOffsetY = 7;
  cx.beginPath();
  cx.moveTo(x, y + B/2);                              // Bugspitze
  cx.quadraticCurveTo(x + 42, y, x + 104, y);
  cx.lineTo(x + L - 16, y);
  cx.quadraticCurveTo(x + L, y, x + L, y + 12);
  cx.lineTo(x + L, y + B - 12);
  cx.quadraticCurveTo(x + L, y + B, x + L - 16, y + B);
  cx.lineTo(x + 104, y + B);
  cx.quadraticCurveTo(x + 42, y + B, x, y + B/2);
  cx.closePath();
  cx.fillStyle = "#3d3229"; cx.fill();
  cx.restore();
  cx.strokeStyle = "rgba(247,231,196,.22)"; cx.lineWidth = 2;   // Schanzkleid
  cx.stroke();
  cx.fillStyle = "rgba(255,243,248,.07)";                        // Deck
  cx.fillRect(x + 104, y + 4, L - 120, 4);
  cx.fillStyle = "#241d1a";                                      // Laderaeume
  for (let i = 0; i < 3; i++) {
    cx.fillRect(x + 126 + i * 84, y + 9, 70, B - 18);
    cx.fillStyle = "rgba(255,243,248,.09)";
    cx.fillRect(x + 126 + i * 84, y + 9, 70, 3);
    cx.fillStyle = "#241d1a";
  }
  rundRect(cx, x + L - 82, y + 5, 66, B - 10, 9);                // Aufbau achtern
  cx.fillStyle = "#4d4038"; cx.fill();
  cx.fillStyle = "rgba(255,214,120,.8)";
  cx.fillRect(x + L - 70, y + 13, 17, 8); cx.fillRect(x + L - 44, y + 13, 17, 8);
  cx.fillStyle = "rgba(120,255,160,.9)";                         // Positionslichter
  cx.beginPath(); cx.arc(x + 14, y + B/2 - 11, 4.5, 0, 7); cx.fill();
  cx.fillStyle = "rgba(255,110,110,.9)";
  cx.beginPath(); cx.arc(x + 14, y + B/2 + 11, 4.5, 0, 7); cx.fill();
}

/* Containerbruecke von oben: Portal auf dem Kai, Ausleger ueber dem Wasser */
function containerbruecke(x) {
  const y0 = KAI_Y + 3, aus = y0 + KAI_H - 18;   // aus = Anfang des Auslegers
  cx.fillStyle = "#2f3a4e";                       // Kranbahn im Kai
  cx.fillRect(x - 64, y0, 128, 5);
  cx.fillRect(x - 64, y0 + KAI_H - 15, 128, 5);

  // Ausleger ueber den Kanal, als Fachwerk
  cx.strokeStyle = "#54617e"; cx.lineWidth = 5;
  cx.beginPath();
  cx.moveTo(x - 13, aus); cx.lineTo(x - 13, aus + 132);
  cx.moveTo(x + 13, aus); cx.lineTo(x + 13, aus + 132);
  cx.stroke();
  cx.strokeStyle = "rgba(84,97,126,.75)"; cx.lineWidth = 2.5;
  cx.beginPath();
  for (let k = 0; k < 9; k++) {
    cx.moveTo(x - 13, aus + k * 15); cx.lineTo(x + 13, aus + (k + 1) * 15);
    cx.moveTo(x + 13, aus + k * 15); cx.lineTo(x - 13, aus + (k + 1) * 15);
  }
  cx.stroke();
  cx.fillStyle = "#3f4c66";                       // Auslegerspitze
  cx.fillRect(x - 15, aus + 128, 30, 9);

  // Gegenausleger landseits
  cx.fillStyle = "#4a5570";
  cx.fillRect(x - 11, y0 - 44, 22, 46);
  // Portaltraeger und Fuesse
  cx.fillRect(x - 58, y0 - 4, 116, 15);
  cx.fillRect(x - 58, aus - 1, 116, 15);
  cx.fillStyle = "#2f3a4e";
  for (const fx of [x - 56, x + 40]) { cx.fillRect(fx, y0 - 2, 16, 13); cx.fillRect(fx, aus + 1, 16, 13); }
  // Maschinenhaus mit Fenstern
  rundRect(cx, x - 28, y0 + 14, 56, 30, 8);
  cx.fillStyle = "#5d6a88"; cx.fill();
  cx.fillStyle = "rgba(255,214,120,.6)";
  cx.fillRect(x - 20, y0 + 20, 14, 7); cx.fillRect(x - 2, y0 + 20, 14, 7);
  cx.fillStyle = GLIMMER_ORANGE;                  // Farbring, wie im Hafen ueblich
  cx.fillRect(x - 58, y0 + 8, 116, 4);

  // Laufkatze mit Spreader am Seil
  const kz = (Math.sin(S.t * 0.45 + x * 0.01) + 1) / 2;
  const ky = aus + 14 + kz * 104;
  cx.strokeStyle = "rgba(230,222,245,.5)"; cx.lineWidth = 1.5;
  cx.beginPath(); cx.moveTo(x - 8, ky); cx.lineTo(x - 8, ky + 16);
  cx.moveTo(x + 8, ky); cx.lineTo(x + 8, ky + 16); cx.stroke();
  cx.fillStyle = "#3f4c66"; cx.fillRect(x - 13, ky - 7, 26, 11);
  cx.fillStyle = GLIMMER_ORANGE; cx.fillRect(x - 16, ky + 14, 32, 8);

  const bl = 0.4 + 0.6 * Math.abs(Math.sin(S.t * 2.4 + x));
  cx.fillStyle = `rgba(255,120,90,${bl})`;
  cx.beginPath(); cx.arc(x, y0 - 49, 5, 0, 7); cx.fill();
}

const CONT_FARBEN = ["#c04d2c", "#8a7a5e", "#41647d", "#a37c33", "#645670", "#cd6328"];
function containerstapel(x, y, n, seed) {
  for (let i = 0; i < n; i++) {
    const bx = x + (i % 4) * 41, by = y + Math.floor(i / 4) * 23;
    const f = CONT_FARBEN[(i * 5 + seed) % CONT_FARBEN.length];
    cx.fillStyle = f; cx.fillRect(bx, by, 38, 20);
    cx.fillStyle = "rgba(255,255,255,.14)"; cx.fillRect(bx, by, 38, 4);
    cx.fillStyle = "rgba(0,0,0,.28)"; cx.fillRect(bx, by + 17, 38, 3);
    cx.strokeStyle = "rgba(0,0,0,.3)"; cx.lineWidth = 1;
    for (let r = 1; r < 5; r++) {
      cx.beginPath(); cx.moveTo(bx + r * 7.6, by); cx.lineTo(bx + r * 7.6, by + 20); cx.stroke();
    }
  }
}

/* Die Kaiflaeche mit allem, was darauf steht */
function kai() {
  cx.fillStyle = "#38304c";
  cx.fillRect(HAF_X1, KAI_Y, HAF_X2 - HAF_X1, KAI_H);
  cx.fillStyle = "rgba(255,243,248,.045)";
  for (let x = HAF_X1; x < HAF_X2; x += 46) cx.fillRect(x, KAI_Y, 1, KAI_H);
  // Kaikante und ihr Schatten aufs Wasser
  cx.fillStyle = "#4a3e63"; cx.fillRect(HAF_X1, WASSER_Y - 9, HAF_X2 - HAF_X1, 9);
  cx.fillStyle = "rgba(255,243,248,.16)"; cx.fillRect(HAF_X1, WASSER_Y - 9, HAF_X2 - HAF_X1, 3);
  cx.fillStyle = "rgba(12,8,20,.45)"; cx.fillRect(HAF_X1, WASSER_Y, HAF_X2 - HAF_X1, 5);
  for (let x = -180; x < 2000; x += 124) {                    // Poller
    cx.fillStyle = "#241c33";

/* Alle paar Takte faehrt eine S-Bahn vorbei, abwechselnd in beide Richtungen */
function sbahn() {
  const LEN = 3 * 200 + 186;                     // vom Kopf bis zum letzten Wagen
  const VON = HAF_X2 + 40, BIS = HAF_X1 - LEN - 40;
  const strecke = VON - BIS;                     // so lang, dass der Zug ganz raus ist
  const takt = 26, fahrt = 8.6;
  const nr = Math.floor(S.t / takt), p = (S.t % takt) / fahrt;
  if (p > 1) return;
  const links = nr % 2 === 0;
  const kopfX = links ? VON - p * strecke : (HAF_X1 - 40) + p * strecke;
  const cy = GLEIS_Y + 21;

  const lg = cx.createRadialGradient(kopfX, cy, 6, kopfX, cy, 210);
  lg.addColorStop(0, "rgba(255,235,170,.34)"); lg.addColorStop(1, "rgba(255,235,170,0)");
  cx.fillStyle = lg; cx.fillRect(kopfX - 220, cy - 120, 440, 240);

  for (let i = 0; i < 4; i++) {
    const wx = (links ? kopfX + i * 200 : kopfX - 186 - i * 200);
    if (wx > HAF_X2 || wx + 186 < HAF_X1) continue;
    cx.save();
    cx.shadowColor = "rgba(0,0,0,.5)"; cx.shadowBlur = 12; cx.shadowOffsetY = 5;
    rundRect(cx, wx, cy - 16, 186, 32, 11);
    cx.fillStyle = i === 0 ? "#c4402a" : "#b8371f"; cx.fill();
    cx.restore();
    cx.fillStyle = "rgba(247,231,196,.75)";
    cx.fillRect(wx + 10, cy - 5, 166, 10);
    cx.fillStyle = "rgba(40,28,34,.5)";
    cx.fillRect(wx + 34, cy - 3, 26, 6); cx.fillRect(wx + 128, cy - 3, 26, 6);
    cx.fillStyle = "rgba(255,214,120,.9)";
    for (let f = 0; f < 6; f++) {
      cx.fillRect(wx + 22 + f * 26, cy - 13, 15, 6);
      cx.fillRect(wx + 22 + f * 26, cy + 7,  15, 6);
    }
  }
}

function welt() {
  const et = S.etage;
  const rms = RAEUME.filter(r => r.et === et);

  if (et === 0) { wasser(); kai(); gleis(); sbahn(); }

  /* --- Puderdose: die Schale um das Haus --- */
  let minX=1e9, minY=1e9, maxX=-1e9, maxY=-1e9;
  for (const r of rms) {
    if (r.art === "strasse" || r.art === "drau") continue;
    minX = Math.min(minX, r.x); minY = Math.min(minY, r.y);
    maxX = Math.max(maxX, r.x + r.w); maxY = Math.max(maxY, r.y + r.h);
  }
  const pad = 34;
  const sx = minX - pad, sy = minY - pad;
  const sw = (maxX - minX) + pad*2, sh = (maxY - minY) + pad*2;

  // Bonbonplastik
  const sg = cx.createLinearGradient(sx, sy, sx + sw*0.16, sy + sh);
  sg.addColorStop(0, "#fff0dc"); sg.addColorStop(.32, "#ffb567");
  sg.addColorStop(.7, "#f5822a"); sg.addColorStop(1, "#cc5410");
  cx.save();
  cx.shadowColor = "rgba(0,0,0,.55)"; cx.shadowBlur = 46; cx.shadowOffsetY = 20;
  rundRect(cx, sx, sy, sw, sh, 52);
  cx.fillStyle = sg; cx.fill();
  cx.restore();

  // Wellenrand, wie am Deckel einer echten Dose
  cx.fillStyle = "rgba(255,255,255,.34)";
  for (let x = sx + 36; x < sx + sw - 32; x += 26) {
    cx.beginPath(); cx.arc(x, sy + 5, 7, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(x, sy + sh - 5, 7, 0, 7); cx.fill();
  }
  for (let yy = sy + 36; yy < sy + sh - 32; yy += 26) {
    cx.beginPath(); cx.arc(sx + 5, yy, 7, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(sx + sw - 5, yy, 7, 0, 7); cx.fill();
  }

  // Perlmuttringe
  rundRect(cx, sx + 10, sy + 10, sw - 20, sh - 20, 44);
  cx.strokeStyle = "rgba(255,255,255,.62)"; cx.lineWidth = 4; cx.stroke();
  rundRect(cx, sx + 17, sy + 17, sw - 34, sh - 34, 38);
  cx.strokeStyle = "rgba(212,104,40,.32)"; cx.lineWidth = 2; cx.stroke();

  // Glitzer im Plastik
  for (let i = 0; i < 30; i++) {
    const gx = sx + 20 + ((i * 137.5) % Math.max(1, sw - 40));
    const gy = sy + 20 + ((i * 61.8) % Math.max(1, sh - 40));
    const fl = 0.3 + 0.7 * Math.abs(Math.sin(S.t * 1.5 + i));
    cx.fillStyle = `rgba(255,255,255,${0.5 * fl})`;
    cx.beginPath(); cx.arc(gx, gy, 1.5 + fl, 0, 7); cx.fill();
  }

  // Scharnier oben, Herzverschluss unten
  cx.fillStyle = "rgba(148,72,20,.34)";
  for (let i = -1; i <= 1; i++) {
    cx.beginPath(); cx.arc(sx + sw/2 + i*44, sy + 15, 9, 0, 7); cx.fill();
  }
  herz(cx, sx + sw/2, sy + sh - 22, 17, "rgba(255,255,255,.75)");
  herz(cx, sx + sw/2, sy + sh - 23, 11, "rgba(255,150,70,.85)");

  klinkerband(minX, minY, maxX, maxY);

  /* --- Straße und Vorplatz --- */
  for (const r of rms) if (r.art === "strasse" || r.id === "vorplatz") boden(r);
  for (const r of rms) if (r.art !== "strasse" && r.id !== "vorplatz") boden(r);

  if (et === 0) vordach();

  /* --- Wände --- */
  for (const r of rms) if (r.art !== "strasse" && r.art !== "drau") waende(r);

  /* --- Möbel --- */
  for (const m of MOEBEL) if (m.et === et) moebel(m);
  wcDeko();
  if (et === 0) plakate();

  // Der Name auf der Kanzel
  cx.save();
  cx.font = `800 21px ${"'Poppins', sans-serif"}`;
  cx.fillStyle = "rgba(247,231,196,.55)";
  cx.textAlign = "center";
  cx.fillText("SERA J", 1520, 204);
  cx.font = `400 9px ${"'Silkscreen', monospace"}`;
  cx.fillStyle = "rgba(247,231,196,.35)";
  cx.fillText("RES NULLIUS", 1520, 186);
  cx.textAlign = "left";
  cx.restore();

  /* --- Licht --- */
  cx.save(); cx.globalCompositeOperation = "lighter";
  for (const r of rms) if (r.art === "club") clublicht(r);
  tresenlicht();
  cx.restore();
}

function boden(r) {
  const c = cx.createLinearGradient(r.x, r.y, r.x + r.w*0.4, r.y + r.h);
  if (r.art === "club") {
    c.addColorStop(0, "#160f22"); c.addColorStop(1, "#241634");
  } else if (r.art === "strasse") {
    c.addColorStop(0, "#2a2140"); c.addColorStop(1, "#1e1832");
  } else if (r.art === "drau") {
    c.addColorStop(0, "#33294a"); c.addColorStop(1, "#271f3c");
  } else if (r.art === "loft") {
    c.addColorStop(0, "#5b4372"); c.addColorStop(1, "#3f2f5b");
  } else if (r.art === "treppe") {
    c.addColorStop(0, "#4c3c67"); c.addColorStop(1, "#35284d");
  } else {
    c.addColorStop(0, "#503e6b"); c.addColorStop(1, "#3a2b57");
  }
  rundRect(cx, r.x, r.y, r.w, r.h, r.art === "strasse" ? 4 : 10);
  cx.fillStyle = c; cx.fill();

  // Bodenmuster: Fliesen drinnen, Pflaster draußen, Dielen im LOFT
  cx.save(); rundRect(cx, r.x, r.y, r.w, r.h, 10); cx.clip();
  cx.strokeStyle = "rgba(255,255,255,.045)"; cx.lineWidth = 1;
  if (r.art === "drau" || r.art === "strasse") {
    for (let y = r.y; y < r.y + r.h; y += 22) {
      for (let x = r.x + ((y/22|0) % 2 ? 11 : 0); x < r.x + r.w; x += 22) {
        cx.strokeRect(x, y, 22, 22);
      }
    }
  } else if (r.art === "loft") {
    for (let y = r.y; y < r.y + r.h; y += 17) {
      cx.beginPath(); cx.moveTo(r.x, y); cx.lineTo(r.x + r.w, y); cx.stroke();
    }
  } else {
    for (let x = r.x; x < r.x + r.w; x += 30) { cx.beginPath(); cx.moveTo(x, r.y); cx.lineTo(x, r.y + r.h); cx.stroke(); }
    for (let y = r.y; y < r.y + r.h; y += 30) { cx.beginPath(); cx.moveTo(r.x, y); cx.lineTo(r.x + r.w, y); cx.stroke(); }
  }
  // Plastikglanz
  const gl = cx.createRadialGradient(r.x + r.w*0.28, r.y + r.h*0.2, 4, r.x + r.w*0.28, r.y + r.h*0.2, r.w*0.7);
  gl.addColorStop(0, "rgba(255,243,248,.09)"); gl.addColorStop(1, "rgba(255,243,248,0)");
  cx.fillStyle = gl; cx.fillRect(r.x, r.y, r.w, r.h);
  cx.restore();

  // Mittelstreifen der Stockmeyerstraße
  if (r.id === "str") {
    cx.save(); cx.strokeStyle = "rgba(255,215,110,.2)"; cx.lineWidth = 3; cx.setLineDash([26, 22]);
    cx.beginPath(); cx.moveTo(r.x, r.y + r.h/2); cx.lineTo(r.x + r.w, r.y + r.h/2); cx.stroke(); cx.restore();
  }

  // Raumschild
  cx.save();
  cx.font = `400 11px ${"'Silkscreen', monospace"}`;
  cx.fillStyle = "rgba(255,243,248,.3)";
  cx.textAlign = "left";
  cx.fillText(r.name.toUpperCase(), r.x + 10, r.y + 18);
  cx.restore();
}

function tuerSpalten(r, seite) {
  // Liefert Lücken (Start/Ende) auf einer Raumseite.
  const l = [];
  for (const t of TUEREN) {
    if (t.et !== r.et) continue;
    if (seite === "n" && Math.abs(t.y + t.h - r.y) < 30 && t.x < r.x + r.w && t.x + t.w > r.x) l.push([t.x, t.x + t.w]);
    if (seite === "s" && Math.abs(t.y - (r.y + r.h)) < 30 && t.x < r.x + r.w && t.x + t.w > r.x) l.push([t.x, t.x + t.w]);
    if (seite === "w" && Math.abs(t.x + t.w - r.x) < 30 && t.y < r.y + r.h && t.y + t.h > r.y) l.push([t.y, t.y + t.h]);
    if (seite === "o" && Math.abs(t.x - (r.x + r.w)) < 30 && t.y < r.y + r.h && t.y + t.h > r.y) l.push([t.y, t.y + t.h]);
  }
  return l;
}

function waende(r, seiten = ["n","o","s","w"]) {
  const D = 11;
  for (const s of seiten) {
    const waag = s === "n" || s === "s";
    const a = waag ? r.x : r.y, b = waag ? r.x + r.w : r.y + r.h;
    let stuecke = [[a - D, b + D]];
    for (const [l1, l2] of tuerSpalten(r, s)) {
      const neu = [];
      for (const [s1, s2] of stuecke) {
        if (l2 <= s1 || l1 >= s2) { neu.push([s1, s2]); continue; }
        if (l1 > s1) neu.push([s1, l1]);
        if (l2 < s2) neu.push([l2, s2]);
      }
      stuecke = neu;
    }
    for (const [p1, p2] of stuecke) {
      let x, y, w, h;
      if (s === "n") { x = p1; y = r.y - D; w = p2 - p1; h = D; }
      else if (s === "s") { x = p1; y = r.y + r.h; w = p2 - p1; h = D; }
      else if (s === "w") { x = r.x - D; y = p1; w = D; h = p2 - p1; }
      else { x = r.x + r.w; y = p1; w = D; h = p2 - p1; }
      cx.save();
      cx.shadowColor = "rgba(0,0,0,.5)"; cx.shadowBlur = 9; cx.shadowOffsetY = 5;
      rundRect(cx, x, y, w, h, 4);
      const g = cx.createLinearGradient(x, y, x, y + h);
      g.addColorStop(0, "#ffdcb0"); g.addColorStop(.4, "#ffa64d"); g.addColorStop(1, "#c05a14");
      cx.fillStyle = g; cx.fill();
      cx.restore();
      cx.fillStyle = "rgba(255,243,248,.42)";
      rundRect(cx, x + 1.5, y + 1.5, Math.max(0, w - 3), 2.4, 1.2); cx.fill();
    }
  }
}

function clublicht(r) {
  const p = 0.55 + S.puls * 0.45;
  const g = cx.createRadialGradient(r.x + r.w/2, r.y + r.h*0.4, 10, r.x + r.w/2, r.y + r.h*0.4, r.w*0.62);
  g.addColorStop(0, farbeAlpha(r.ton, 0.3 * p));
  g.addColorStop(1, farbeAlpha(r.ton, 0));
  cx.fillStyle = g; cx.fillRect(r.x, r.y, r.w, r.h);

  // Laser aus der DJ-Kanzel
  const dj = MOEBEL.find(m => m.raum === r.id);
  if (!dj) return;
  const qx = dj.x + dj.w/2, qy = dj.y + dj.h;
  for (let i = 0; i < 5; i++) {
    const a = Math.PI/2 + Math.sin(S.t * (0.7 + i*0.13) + i * 1.5) * 0.78;
    const len = r.h * 1.05;
    const ex = qx + Math.cos(a) * len, ey = qy + Math.sin(a) * len;
    const lg = cx.createLinearGradient(qx, qy, ex, ey);
    lg.addColorStop(0, farbeAlpha(r.ton, 0.4 * p));
    lg.addColorStop(1, farbeAlpha(r.ton, 0));
    cx.fillStyle = lg;
    cx.beginPath(); cx.moveTo(qx, qy);
    cx.lineTo(ex - Math.sin(a)*13, ey + Math.cos(a)*13);
    cx.lineTo(ex + Math.sin(a)*13, ey - Math.cos(a)*13);
    cx.closePath(); cx.fill();
  }
}

function tresenlicht() {

}

// Damit die Toiletten auch als Toiletten zu erkennen sind

  cx.save();

  // Den Namen schreibt schon waende() an die Wand, hier nur der Farbton.
  for (const [r, ton] of [[R.wcf, "rgba(255,110,190,.15)"], [R.wca, "rgba(110,200,255,.15)"]]) {
    cx.fillStyle = ton;
    cx.fillRect(r.x, r.y, r.w, r.h);
  }

  // Kabinen: Tuerblatt, Besetztzeichen, Schuessel, Spuelkasten

  }

  // Waschbecken mit Spiegel
  for (const b of MOEBEL.filter(m => m.typ === "becken")) {
    cx.fillStyle = "rgba(186,224,255,.2)";
    cx.fillRect(b.x + 4, b.y - 21, b.w - 8, 17);
    cx.strokeStyle = "rgba(255,255,255,.4)"; cx.lineWidth = 1;
    cx.strokeRect(b.x + 4, b.y - 21, b.w - 8, 17);
    cx.fillStyle = "rgba(248,240,252,.9)";
    for (let i = 0; i < 3; i++) {
      cx.beginPath(); cx.ellipse(b.x + 18 + i*28, b.y + b.h/2, 10, 7, 0, 0, 7); cx.fill();
      cx.fillStyle = "rgba(120,100,140,.45)";

      cx.fillStyle = "rgba(248,240,252,.9)";
    }
  }

  // Rollstuhlgerechtes WC, 1,5 × 1,5 m laut Plan

    cx.beginPath(); cx.arc(mx - 4, my - 13, 4.2, 0, 7); cx.stroke();
    cx.beginPath(); cx.moveTo(mx - 4, my - 8); cx.lineTo(mx - 4, my + 3);
    cx.lineTo(mx + 9, my + 3); cx.stroke();
    cx.fillStyle = "rgba(248,238,250,.85)";
    cx.beginPath(); cx.ellipse(a.x + 18, a.y + 22, 8, 10, 0, 0, 7); cx.fill();
    cx.fillStyle = "rgba(96,74,118,.5)";
    cx.beginPath(); cx.ellipse(a.x + 18, a.y + 22, 5, 6.5, 0, 0, 7); cx.fill();
  }
  cx.restore();
}

function moebel(m) {
  cx.save();
  cx.shadowColor = "rgba(0,0,0,.55)"; cx.shadowBlur = 11; cx.shadowOffsetY = 6;
  rundRect(cx, m.x, m.y, m.w, m.h, 6);
  let f = "#4a3a63";
  if (m.typ === "tresen" || m.typ === "kasse") f = "#7b5238";
  if (m.typ === "box" || m.typ === "dj" || m.typ === "djq") f = "#241a33";
  if (m.typ === "tisch") f = "#6a4c78";
  if (m.typ === "beet") f = "#2d4a3c";
  if (m.typ === "wagen") f = "#8a4a52";
  if (m.typ === "garderobe" || m.typ === "locker") f = "#8a6a2e";
  if (m.typ === "buegel") f = "#33284a";
  if (m.typ === "kabine") f = "#5d4576";
  if (m.typ === "becken") f = "#7b6a90";
  if (m.typ === "sofa") f = "#4a3a63";
  if (m.typ === "accwc") f = "#5d4576";
  if (m.typ === "wand") f = "#c5701e";
  if (m.typ === "foh") f = "#241a33";
  if (m.typ === "awareness") f = "#2f7d6a";
  cx.fillStyle = f; cx.fill();
  cx.restore();
  cx.fillStyle = "rgba(255,243,248,.22)";
  rundRect(cx, m.x + 2, m.y + 2, m.w - 4, 3, 1.5); cx.fill();

  if (m.typ === "awareness") {
    // Ein Block, auf dem Awareness steht — damit klar ist, wo man hingeht
    cx.save();
    cx.font = "700 11px 'Silkscreen', monospace";
    cx.textAlign = "center"; cx.textBaseline = "middle";
    cx.fillStyle = "rgba(10,30,26,.55)";
    cx.fillText("AWARENESS", m.x + m.w/2 + 1, m.y + m.h/2 + 2);
    cx.fillStyle = "rgba(223,255,244,.95)";
    cx.fillText("AWARENESS", m.x + m.w/2, m.y + m.h/2 + 1);
    cx.textAlign = "left"; cx.textBaseline = "alphabetic";
    // kleine Lampe, die ruhig pulst
    const pl = 0.5 + 0.5 * Math.abs(Math.sin(S.t * 1.1));
    cx.fillStyle = `rgba(159,245,196,${0.5 + 0.45 * pl})`;
    cx.beginPath(); cx.arc(m.x + 10, m.y + m.h / 2, 3.4, 0, 7); cx.fill();
    cx.restore();
  }
  if (m.typ === "box" || m.typ === "djq") {
    const wow = 1 + S.puls * 0.1;
    cx.fillStyle = "rgba(20,12,28,.95)";
    for (let i = 0; i < (m.h > m.w ? 3 : 2); i++) {
      const cxx = m.x + m.w/2, cyy = m.y + m.h*(i+1)/((m.h > m.w ? 3 : 2)+1);
      cx.beginPath(); cx.arc(cxx, cyy, Math.min(m.w, m.h)*0.24*wow, 0, 7); cx.fill();
      cx.fillStyle = "rgba(255,150,64,.35)";
      cx.beginPath(); cx.arc(cxx, cyy, Math.min(m.w, m.h)*0.1*wow, 0, 7); cx.fill();
      cx.fillStyle = "rgba(20,12,28,.95)";
    }
  }
  if (m.typ === "dj" || m.typ === "djq") {
    cx.fillStyle = "#3ef1e4";
    for (let i = 0; i < 3; i++) {
      cx.globalAlpha = 0.4 + Math.abs(Math.sin(S.t*3 + i))*0.6;
      cx.fillRect(m.x + 12 + i*(m.w > m.h ? 34 : 9), m.y + m.h/2 - 2, m.w > m.h ? 22 : 6, 4);
    }
    cx.globalAlpha = 1;
  }
  if (m.typ === "buegel") {
    cx.strokeStyle = "rgba(255,243,248,.3)"; cx.lineWidth = 2;
    for (let x = m.x + 14; x < m.x + m.w - 8; x += 17) {
      cx.beginPath(); cx.moveTo(x, m.y + 8); cx.lineTo(x + 7, m.y + 30); cx.lineTo(x + 14, m.y + 8); cx.stroke();
    }
  }
  if (m.typ === "locker") {
    cx.strokeStyle = "rgba(20,12,6,.45)"; cx.lineWidth = 1.4;
    for (let x = m.x + 13; x < m.x + m.w - 4; x += 13) {
      cx.beginPath(); cx.moveTo(x, m.y + 3); cx.lineTo(x, m.y + m.h - 3); cx.stroke();
    }
    cx.fillStyle = "rgba(255,243,248,.55)";
    for (let x = m.x + 8; x < m.x + m.w - 6; x += 13) cx.fillRect(x, m.y + m.h/2 - 1, 3, 2);
  }
  if (m.typ === "kabine") {
    cx.strokeStyle = "rgba(255,243,248,.3)"; cx.lineWidth = 1.4;
    for (let x = m.x + 30; x < m.x + m.w - 6; x += 30) {
      cx.beginPath(); cx.moveTo(x, m.y + 2); cx.lineTo(x, m.y + m.h - 2); cx.stroke();
    }
  }
  if (m.typ === "becken") {
    cx.fillStyle = "rgba(255,243,248,.42)";
    for (let x = m.x + 12; x < m.x + m.w - 8; x += 26) {
      cx.beginPath(); cx.ellipse(x + 8, m.y + m.h/2, 8, 5, 0, 0, 7); cx.fill();
    }
  }
  if (m.typ === "foh") {
    cx.fillStyle = "#3ef1e4";
    for (let i = 0; i < 4; i++) {
      cx.globalAlpha = 0.3 + Math.abs(Math.sin(S.t*2.2 + i*1.3))*0.7;
      cx.fillRect(m.x + 10 + (i%2)*32, m.y + 14 + Math.floor(i/2)*22, 22, 4);
    }
    cx.globalAlpha = 1;
  }
  if (m.typ === "garderobe") {
    cx.font = `400 10px ${"'Silkscreen', monospace"}`;
    cx.fillStyle = "rgba(40,24,6,.75)"; cx.textAlign = "center";
    cx.fillText("GARDEROBE", m.x + m.w/2, m.y + m.h/2 + 4);
    cx.textAlign = "left";
  }
  if (m.typ === "beet") {
    cx.fillStyle = "#4e7a5c";
    for (let i = 0; i < 4; i++) {
      cx.beginPath();
      cx.arc(m.x + 8 + (i%2)*20, m.y + 12 + Math.floor(i/2)*26, 9, 0, 7); cx.fill();
    }
  }
}

function farbeAlpha(hex, a) {
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;
}

/* ---- Herzchen fuer Dose und Deko ---- */
function herz(c, x, y, r, farbe) {
  c.save(); c.translate(x, y); c.scale(r/16, r/16);
  c.beginPath();
  c.moveTo(0, 7);
  c.bezierCurveTo(-15, -6, -9, -19, 0, -10);
  c.bezierCurveTo(9, -19, 15, -6, 0, 7);
  c.closePath(); c.fillStyle = farbe; c.fill(); c.restore();
}

/* ---- Garderobe des Abends ---- */
const ACC_POOL = [
  ["shades","netz","harness"], ["kopfhoerer","guertel","tasche"], ["visor","netz"],
  ["buckethat","harness","tasche"], ["brille","stulpen"], ["shades","harness","guertel","netz"],
  ["kopfhoerer","stulpen","tasche"], ["visor","guertel"], ["shades","netz","stulpen"],
];
const accVon = i => ACC_POOL[((i % ACC_POOL.length) + ACC_POOL.length) % ACC_POOL.length];

/* ---- Figuren: Riesenkopf, Winzkoerper, Schlaghose, Technofummel ---- */
function figur(f, groesseF = 1, leuchten = null) {
  const s = groesseF;
  const geh = Math.sin(f.schritt) * 2.6 * s;
  const hopp = Math.abs(Math.sin(f.schritt)) * 1.7 * s;
  const y = f.y - hopp;
  const acc = f.acc || [];
  const akz = f.akz || "#3ef1e4";
  const haar = f.haar || "#ff7a2e";
  const stil = f.stil || "lang";
  const mann = !!f.mann;

  cx.fillStyle = "rgba(0,0,0,.4)";
  cx.beginPath(); cx.ellipse(f.x, f.y + 14.5*s, 11*s, 4.2*s, 0, 0, 7); cx.fill();

  if (leuchten) {
    cx.save(); cx.globalCompositeOperation = "lighter";
    const g = cx.createRadialGradient(f.x, y - 12*s, 2, f.x, y - 12*s, 40*s);
    g.addColorStop(0, farbeAlpha(leuchten, .32)); g.addColorStop(1, farbeAlpha(leuchten, 0));
    cx.fillStyle = g; cx.beginPath(); cx.arc(f.x, y - 12*s, 40*s, 0, 7); cx.fill();
    cx.restore();
  }

  // Lange Haare, hintere Haelfte
  if (stil !== "kurz" && stil !== "buzz") {
    cx.fillStyle = haar;
    rundRect(cx, f.x - 11.4*s, y - 28*s, 22.8*s, 27*s, 10*s); cx.fill();
  }

  // Schlaghosen
  const bein = (ox, schwung) => {
    cx.beginPath();
    cx.moveTo(f.x + ox - 2.5*s, y - 2.4*s);
    cx.lineTo(f.x + ox + 2.5*s, y - 2.4*s);
    cx.lineTo(f.x + ox + 4.8*s, y + (10.6 + schwung)*s);
    cx.lineTo(f.x + ox - 4.8*s, y + (10.6 + schwung)*s);
    cx.closePath(); cx.fill();
  };
  cx.fillStyle = f.hose || "#2b2140";
  bein(-3.5*s, geh*0.32); bein(3.5*s, -geh*0.32);

  if (acc.includes("stulpen")) {
    cx.fillStyle = akz;
    rundRect(cx, f.x - 8.2*s, y + (6.4 + geh*0.32)*s, 9.4*s, 4.4*s, 2*s); cx.fill();
    rundRect(cx, f.x - 1.2*s, y + (6.4 - geh*0.32)*s, 9.4*s, 4.4*s, 2*s); cx.fill();
  }

  // Plateaustiefel
  cx.fillStyle = "#f8eefa";
  rundRect(cx, f.x - 8.6*s, y + (10.2 + geh*0.32)*s, 7.8*s, 5.4*s, 2.2*s); cx.fill();
  rundRect(cx, f.x + 0.8*s, y + (10.2 - geh*0.32)*s, 7.8*s, 5.4*s, 2.2*s); cx.fill();
  cx.fillStyle = "rgba(0,0,0,.2)";
  rundRect(cx, f.x - 8.6*s, y + (13.4 + geh*0.32)*s, 7.8*s, 2.2*s, 1.1*s); cx.fill();
  rundRect(cx, f.x + 0.8*s, y + (13.4 - geh*0.32)*s, 7.8*s, 2.2*s, 1.1*s); cx.fill();

  // Arme
  cx.strokeStyle = f.haut; cx.lineWidth = (mann ? 2.9 : 2.5)*s; cx.lineCap = "round";
  cx.beginPath();
  cx.moveTo(f.x - 5.6*s, y - 10.4*s); cx.lineTo(f.x - 7.8*s, y - 1.6*s);
  cx.moveTo(f.x + 5.6*s, y - 10.4*s); cx.lineTo(f.x + 7.8*s, y - 1.6*s);
  cx.stroke(); cx.lineCap = "butt";
  if (f.tattoo) {
    cx.fillStyle = "rgba(24,16,30,.45)";
    cx.fillRect(f.x - 7.9*s, y - 6.4*s, 1.5*s, 2.4*s);
    cx.fillRect(f.x + 6.4*s, y - 7.2*s, 1.3*s, 1.9*s);
    cx.fillRect(f.x + 6.8*s, y - 4.4*s, 1.1*s, 1.5*s);
  }
  if (f.uhr) {
    cx.fillStyle = "#c9d1de";
    rundRect(cx, f.x + 6.3*s, y - 3.8*s, 3.4*s, 2.5*s, 1.1*s); cx.fill();
    cx.fillStyle = "rgba(255,255,255,.55)";
    rundRect(cx, f.x + 6.8*s, y - 3.4*s, 1.4*s, 0.9*s, 0.45*s); cx.fill();
  }

  // Bauchfreies Oberteil mit Wespentaille
  const oben = () => {
    cx.beginPath();
    if (mann) {
      cx.moveTo(f.x - 7.6*s, y - 11.8*s);
      cx.lineTo(f.x + 7.6*s, y - 11.8*s);
      cx.lineTo(f.x + 6.4*s, y - 4.4*s);
      cx.lineTo(f.x - 6.4*s, y - 4.4*s);
    } else {
      cx.moveTo(f.x - 6.6*s, y - 11.6*s);
      cx.lineTo(f.x + 6.6*s, y - 11.6*s);
      cx.lineTo(f.x + 4.2*s, y - 4.6*s);
      cx.lineTo(f.x - 4.2*s, y - 4.6*s);
    }
    cx.closePath();
  };
  oben(); cx.fillStyle = f.fit; cx.fill();

  if (acc.includes("netz")) {
    cx.save(); oben(); cx.clip();
    cx.strokeStyle = "rgba(255,255,255,.32)"; cx.lineWidth = 0.7*s;
    for (let i = -5; i < 6; i++) {
      cx.beginPath();
      cx.moveTo(f.x + i*3*s, y - 13*s); cx.lineTo(f.x + i*3*s + 10*s, y - 3*s);
      cx.moveTo(f.x + i*3*s, y - 13*s); cx.lineTo(f.x + i*3*s - 10*s, y - 3*s);
      cx.stroke();
    }
    cx.restore();
  }
  if (acc.includes("harness")) {
    cx.strokeStyle = akz; cx.lineWidth = 1.5*s; cx.lineCap = "round";
    cx.beginPath();
    cx.moveTo(f.x - 4.6*s, y - 11.2*s); cx.lineTo(f.x + 2.8*s, y - 4.8*s);
    cx.moveTo(f.x + 4.6*s, y - 11.2*s); cx.lineTo(f.x - 2.8*s, y - 4.8*s);
    cx.stroke();
    cx.lineWidth = 1.9*s;
    cx.beginPath(); cx.moveTo(f.x - 6.2*s, y - 8.6*s); cx.lineTo(f.x + 6.2*s, y - 8.6*s); cx.stroke();
    cx.lineCap = "butt";
    cx.fillStyle = "#e8e2f0";
    cx.beginPath(); cx.arc(f.x, y - 8.6*s, 1.3*s, 0, 7); cx.fill();
  }
  cx.fillStyle = "rgba(255,255,255,.22)";
  rundRect(cx, f.x - 5.2*s, y - 10.6*s, 3*s, 4.6*s, 1.5*s); cx.fill();

  // Huefte mit Guertel
  if (acc.includes("guertel")) {
    cx.fillStyle = "#241b30";
    rundRect(cx, f.x - 5.4*s, y - 3.6*s, 10.8*s, 2.8*s, 1.4*s); cx.fill();
    cx.fillStyle = "#d7dbe6";
    rundRect(cx, f.x - 1.4*s, y - 3.3*s, 2.8*s, 2.2*s, 0.7*s); cx.fill();
    cx.strokeStyle = "#cdd3df"; cx.lineWidth = 1*s;
    cx.beginPath(); cx.arc(f.x + 4.4*s, y - 0.4*s, 1.8*s, 0.6, 5.6); cx.stroke();
  }

  // Handtasche
  if (acc.includes("tasche")) {
    cx.strokeStyle = akz; cx.lineWidth = 0.9*s;
    cx.beginPath(); cx.arc(f.x + 9.2*s, y - 3.4*s, 2.4*s, Math.PI, 0); cx.stroke();
    cx.fillStyle = akz;
    rundRect(cx, f.x + 6.4*s, y - 3.4*s, 5.6*s, 4.4*s, 1.5*s); cx.fill();
    cx.fillStyle = "rgba(255,255,255,.35)";
    rundRect(cx, f.x + 7.2*s, y - 2.8*s, 2*s, 1*s, 0.5*s); cx.fill();
  }

  // Jacke ueber dem Arm
  if (f.jacke) {
    cx.fillStyle = akz;
    rundRect(cx, f.x - 12.2*s, y - 6.6*s, 5.4*s, 8.6*s, 2.7*s); cx.fill();
    cx.fillStyle = "rgba(0,0,0,.22)";
    rundRect(cx, f.x - 12.2*s, y - 1.8*s, 5.4*s, 2*s, 1*s); cx.fill();
  }

  // Der Kopf, viel zu gross und genau deshalb richtig
  cx.fillStyle = f.haut;
  cx.beginPath(); cx.ellipse(f.x, y - 19*s, 9.4*s, 10.2*s, 0, 0, 7); cx.fill();

  // Frisur vorne
  cx.fillStyle = haar;
  if (stil === "lang") {
    cx.beginPath(); cx.ellipse(f.x, y - 23.6*s, 10.2*s, 7.4*s, 0, Math.PI, Math.PI*2); cx.fill();
    rundRect(cx, f.x - 10.6*s, y - 24*s, 4.6*s, 20*s, 2.3*s); cx.fill();
    rundRect(cx, f.x + 6*s, y - 24*s, 4.6*s, 20*s, 2.3*s); cx.fill();
  } else if (stil === "buzz") {
    cx.beginPath(); cx.ellipse(f.x, y - 22.4*s, 9.9*s, 7.8*s, 0, Math.PI, Math.PI*2); cx.fill();
    rundRect(cx, f.x - 9.9*s, y - 22.8*s, 19.8*s, 5.4*s, 2.6*s); cx.fill();
  } else if (stil === "kurz") {
    cx.beginPath(); cx.ellipse(f.x, y - 23.2*s, 10.4*s, 7.6*s, 0, Math.PI, Math.PI*2); cx.fill();
    rundRect(cx, f.x - 10.4*s, y - 23.6*s, 4.4*s, 12*s, 2.2*s); cx.fill();
    rundRect(cx, f.x + 6*s, y - 23.6*s, 4.4*s, 12*s, 2.2*s); cx.fill();
  } else if (stil === "zoepfe") {
    cx.beginPath(); cx.ellipse(f.x, y - 23.6*s, 10*s, 7*s, 0, Math.PI, Math.PI*2); cx.fill();
    rundRect(cx, f.x - 14*s, y - 26*s, 5.2*s, 20*s, 2.6*s); cx.fill();
    rundRect(cx, f.x + 8.8*s, y - 26*s, 5.2*s, 20*s, 2.6*s); cx.fill();
    cx.fillStyle = akz;
    cx.beginPath(); cx.arc(f.x - 11.4*s, y - 25*s, 2.2*s, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(f.x + 11.4*s, y - 25*s, 2.2*s, 0, 7); cx.fill();
  } else if (stil === "pony") {
    rundRect(cx, f.x - 10.6*s, y - 29*s, 21.2*s, 10*s, 4.4*s); cx.fill();
    rundRect(cx, f.x - 10.6*s, y - 25*s, 4.8*s, 21*s, 2.4*s); cx.fill();
    rundRect(cx, f.x + 5.8*s, y - 25*s, 4.8*s, 21*s, 2.4*s); cx.fill();
  } else {
    cx.beginPath(); cx.ellipse(f.x, y - 23.4*s, 10*s, 7.2*s, 0, Math.PI, Math.PI*2); cx.fill();
    rundRect(cx, f.x - 10.4*s, y - 23.6*s, 4.4*s, 18*s, 2.2*s); cx.fill();
    rundRect(cx, f.x + 6*s, y - 23.6*s, 4.4*s, 18*s, 2.2*s); cx.fill();
    cx.beginPath(); cx.arc(f.x, y - 31.4*s, 5.6*s, 0, 7); cx.fill();
    cx.fillStyle = akz;
    cx.beginPath(); cx.arc(f.x, y - 27.6*s, 2*s, 0, 7); cx.fill();
  }
  cx.fillStyle = "rgba(255,255,255,.42)";
  cx.beginPath(); cx.ellipse(f.x - 4.4*s, y - 26*s, 3.6*s, 1.8*s, -0.4, 0, 7); cx.fill();

  const schautHer = Math.sin(f.blick) > -0.25;

  // Gesicht mit viel Make-up
  if (schautHer && !acc.includes("visor") && !acc.includes("brille")) {
    if (!mann) {
      cx.fillStyle = farbeAlpha(akz, .42);
      cx.beginPath(); cx.ellipse(f.x - 3.7*s, y - 20.6*s, 3.2*s, 2*s, -0.2, 0, 7); cx.fill();
      cx.beginPath(); cx.ellipse(f.x + 3.7*s, y - 20.6*s, 3.2*s, 2*s, 0.2, 0, 7); cx.fill();
    }
    cx.fillStyle = "#fffdfb";
    cx.beginPath(); cx.ellipse(f.x - 3.7*s, y - 19.4*s, 2.8*s, 2.3*s, -0.12, 0, 7); cx.fill();
    cx.beginPath(); cx.ellipse(f.x + 3.7*s, y - 19.4*s, 2.8*s, 2.3*s, 0.12, 0, 7); cx.fill();
    cx.fillStyle = f.augen || "#3b2352";
    cx.beginPath(); cx.arc(f.x - 3.5*s, y - 19.2*s, 1.8*s, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(f.x + 3.9*s, y - 19.2*s, 1.8*s, 0, 7); cx.fill();
    cx.fillStyle = "#17101c";
    cx.beginPath(); cx.arc(f.x - 3.5*s, y - 19.2*s, 0.85*s, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(f.x + 3.9*s, y - 19.2*s, 0.85*s, 0, 7); cx.fill();
    cx.fillStyle = "rgba(255,255,255,.95)";
    cx.beginPath(); cx.arc(f.x - 4.3*s, y - 20*s, 0.75*s, 0, 7); cx.fill();
    cx.beginPath(); cx.arc(f.x + 3.1*s, y - 20*s, 0.75*s, 0, 7); cx.fill();
    cx.strokeStyle = "#1d1220"; cx.lineCap = "round";
    if (mann) {
      // schmale Lidlinie, keine Wimpern
      cx.lineWidth = 0.9*s;
      cx.beginPath(); cx.arc(f.x - 3.7*s, y - 19.4*s, 3*s, Math.PI*1.12, Math.PI*1.82); cx.stroke();
      cx.beginPath(); cx.arc(f.x + 3.7*s, y - 19.4*s, 3*s, Math.PI*1.18, Math.PI*1.88); cx.stroke();
      // Brauen
      cx.lineWidth = 1.3*s;
      cx.beginPath(); cx.moveTo(f.x - 6.4*s, y - 23.4*s); cx.lineTo(f.x - 1.4*s, y - 22.6*s); cx.stroke();
      cx.beginPath(); cx.moveTo(f.x + 6.4*s, y - 23.4*s); cx.lineTo(f.x + 1.4*s, y - 22.6*s); cx.stroke();
      cx.lineCap = "butt";
      // schmaler Mund
      cx.strokeStyle = "#7a3a48"; cx.lineWidth = 1.5*s; cx.lineCap = "round";
      cx.beginPath(); cx.moveTo(f.x - 2.4*s, y - 13.8*s); cx.lineTo(f.x + 2.4*s, y - 13.8*s); cx.stroke();
      cx.lineCap = "butt";
      // Dreitagebart: Kinn und Kiefer, dazu ein Schnauzer
      cx.fillStyle = "rgba(34,22,20,.26)";
      cx.beginPath(); cx.ellipse(f.x, y - 13.6*s, 6.6*s, 4.8*s, 0, 0, Math.PI); cx.fill();
      cx.fillStyle = "rgba(34,22,20,.34)";
      rundRect(cx, f.x - 3.2*s, y - 15.8*s, 6.4*s, 1.5*s, 0.7*s); cx.fill();
    } else {
      cx.lineWidth = 1.2*s;
      cx.beginPath(); cx.arc(f.x - 3.7*s, y - 19.4*s, 3*s, Math.PI*1.04, Math.PI*1.9); cx.stroke();
      cx.beginPath(); cx.arc(f.x + 3.7*s, y - 19.4*s, 3*s, Math.PI*1.1, Math.PI*1.96); cx.stroke();
      cx.lineWidth = 0.95*s;
      cx.beginPath(); cx.moveTo(f.x - 6.4*s, y - 20.8*s); cx.lineTo(f.x - 8.2*s, y - 22*s); cx.stroke();
      cx.beginPath(); cx.moveTo(f.x + 6.4*s, y - 20.8*s); cx.lineTo(f.x + 8.2*s, y - 22*s); cx.stroke();
      cx.lineCap = "butt";
      cx.fillStyle = f.lippen || "#c85a2a";
      cx.beginPath(); cx.ellipse(f.x, y - 13.8*s, 3*s, 1.9*s, 0, 0, 7); cx.fill();
      cx.fillStyle = "rgba(255,255,255,.62)";
      cx.beginPath(); cx.ellipse(f.x - 0.8*s, y - 14.4*s, 1.2*s, 0.55*s, 0, 0, 7); cx.fill();
      cx.fillStyle = "rgba(240,150,90,.3)";
      cx.beginPath(); cx.arc(f.x - 7*s, y - 16.4*s, 2.2*s, 0, 7); cx.fill();
      cx.beginPath(); cx.arc(f.x + 7*s, y - 16.4*s, 2.2*s, 0, 7); cx.fill();
    }
  }

  // Sonnenbrille auf der Stirn — das Erkennungszeichen
  if (acc.includes("shades")) {
    cx.fillStyle = "#15101e";
    rundRect(cx, f.x - 8.8*s, y - 27.2*s, 7.6*s, 3.8*s, 1.9*s); cx.fill();
    rundRect(cx, f.x + 1.2*s, y - 27.2*s, 7.6*s, 3.8*s, 1.9*s); cx.fill();
    cx.strokeStyle = "#15101e"; cx.lineWidth = 1.3*s;

    cx.fillStyle = "rgba(255,255,255,.4)";

function mische(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const k = (v, w) => Math.round(v*(1-t) + w*t);
  return `rgb(${k(pa>>16&255, pb>>16&255)},${k(pa>>8&255, pb>>8&255)},${k(pa&255, pb&255)})`;
}

function stern(c, x, y, r, dreh, fuell, rand) {

  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = i % 2 ? r * 0.42 : r;
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    i ? c.lineTo(px, py) : c.moveTo(px, py);
  }
  c.closePath();
  c.fillStyle = fuell; c.fill();
  if (rand) { c.strokeStyle = rand; c.lineWidth = Math.max(1, r * 0.15); c.lineJoin = "round"; c.stroke(); }
  c.restore();
}

// Der Klinkerbau als Scherenschnitt: Staffelattika, Fensterreihen, Rundbogentore
function klinkerRiss(x, y, b, h, farbe) {
  cx.fillStyle = farbe;
  cx.beginPath();
  cx.moveTo(x, y);
  cx.lineTo(x, y - h * 0.84);
  cx.lineTo(x + b * 0.05, y - h * 0.92);
  cx.lineTo(x + b * 0.33, y - h * 0.92);
  cx.lineTo(x + b * 0.37, y - h);
  cx.lineTo(x + b * 0.69, y - h);
  cx.lineTo(x + b * 0.73, y - h * 0.9);
  cx.lineTo(x + b, y - h * 0.9);
  cx.lineTo(x + b, y);
  cx.closePath(); cx.fill();

  // Ziegellagen
  cx.save(); cx.globalAlpha = 0.5;
  cx.strokeStyle = "rgba(255,228,208,.3)"; cx.lineWidth = 1;
  for (let yy = y - h * 0.88; yy < y; yy += h * 0.035) {
    cx.beginPath(); cx.moveTo(x, yy); cx.lineTo(x + b, yy); cx.stroke();
  }
  cx.restore();

  // Drei Fensterreihen
  cx.fillStyle = "rgba(255,255,255,.22)";
  for (let g = 0; g < 3; g++) {
    for (let k = 0; k < 9; k++) {
      cx.fillRect(x + b * 0.055 + k * b * 0.104, y - h * (0.78 - g * 0.21), b * 0.05, h * 0.14);
    }
  }

  // Zwei Rundbogentore im Erdgeschoss, wie auf dem Foto
  cx.fillStyle = "rgba(18,9,22,.6)";
  for (const tx of [x + b * 0.27, x + b * 0.57]) {
    const tw = b * 0.1, th = h * 0.24;
    cx.beginPath();
    cx.moveTo(tx, y);
    cx.lineTo(tx, y - th + tw / 2);
    cx.arc(tx + tw / 2, y - th + tw / 2, tw / 2, Math.PI, 0);
    cx.lineTo(tx + tw, y);
    cx.closePath(); cx.fill();
  }

  // Graffiti — der Bau ist von oben bis unten besprüht
  const bunt = ["rgba(255,214,72,.55)","rgba(120,224,182,.5)","rgba(240,150,90,.45)",
                "rgba(140,170,255,.45)","rgba(255,160,90,.5)"];
  for (let i = 0; i < 9; i++) {
    cx.fillStyle = bunt[i % bunt.length];
    const gx = x + b * (0.07 + i * 0.1), gy = y - h * (0.28 + (i % 4) * 0.17);
    cx.save(); cx.translate(gx, gy); cx.rotate(Math.sin(i * 2.3) * 0.5);
    cx.fillRect(-b * 0.035, -h * 0.022, b * 0.07, h * 0.044);
    cx.restore();
  }
}
const Ton = {
  an:false, ctx:null, bus:null, filter:null, schritt:0, naechste:0,
  start() {
    if (this.an) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.filter = this.ctx.createBiquadFilter();
    this.filter.type = "lowpass"; this.filter.frequency.value = 300; this.filter.Q.value = 1.2;
    const komp = this.ctx.createDynamicsCompressor();
    komp.threshold.value = -13; komp.ratio.value = 7;
    this.bus = this.ctx.createGain(); this.bus.gain.value = 0.72;
    this.bus.connect(this.filter); this.filter.connect(komp); komp.connect(this.ctx.destination);
    this.an = true; this.naechste = this.ctx.currentTime + 0.08;
  },
  rausch(dauer) {
    const n = this.ctx.sampleRate * dauer | 0;
    const b = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const s = this.ctx.createBufferSource(); s.buffer = b; return s;
  },
  kick(t) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.frequency.setValueAtTime(128, t);
    o.frequency.exponentialRampToValueAtTime(41, t + 0.09);
    g.gain.setValueAtTime(0.95, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.31);
    o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + 0.34);
  },
  clap(t) {
    const s = this.rausch(0.19), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    f.type = "bandpass"; f.frequency.value = 1750; f.Q.value = 1.1;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.4, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.17);
    s.connect(f); f.connect(g); g.connect(this.bus); s.start(t); s.stop(t + 0.2);
  },
  hat(t, offen) {
    const s = this.rausch(offen ? 0.14 : 0.05), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    f.type = "highpass"; f.frequency.value = 8200;
    g.gain.setValueAtTime(offen ? 0.2 : 0.12, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (offen ? 0.13 : 0.045));
    s.connect(f); f.connect(g); g.connect(this.bus); s.start(t); s.stop(t + 0.15);
  },
  bass(t, hz, lang) {
    const o = this.ctx.createOscillator(), f = this.ctx.createBiquadFilter(), g = this.ctx.createGain();
    o.type = "sawtooth"; o.frequency.value = hz;
    f.type = "lowpass"; f.Q.value = 11;
    const oeff = 340 + Math.sin(this.schritt * 0.045) * 900 + 900;
    f.frequency.setValueAtTime(Math.max(180, oeff), t);
    f.frequency.exponentialRampToValueAtTime(190, t + (lang ? 0.3 : 0.14));
    g.gain.setValueAtTime(0.19, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (lang ? 0.32 : 0.15));
    o.connect(f); f.connect(g); g.connect(this.bus); o.start(t); o.stop(t + 0.36);
  },
  stab(t) {
    [0, 3, 7].forEach(halb => {
      const o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = "sawtooth"; o.frequency.value = 220 * Math.pow(2, halb / 12);
      o.detune.value = (Math.random() * 16 - 8);
      g.gain.setValueAtTime(0.055, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
      o.connect(g); g.connect(this.bus); o.start(t); o.stop(t + 0.26);
    });
  },
  tick() {
    if (!this.an) return;
    const sech = 60 / 140 / 4;
    const bassNoten = [55, 0, 55, 82.4, 0, 55, 0, 73.4, 55, 0, 61.7, 0, 55, 82.4, 0, 92.5];
    while (this.naechste < this.ctx.currentTime + 0.14) {
      const t = this.naechste, i = this.schritt % 16, takt = Math.floor(this.schritt / 16);
      if (i % 4 === 0) { this.kick(t); S.puls = 1; S.beat = i / 4; }
      if (i === 4 || i === 12) this.clap(t);
      this.hat(t, i % 4 === 2);
      const b = bassNoten[i];
      if (b) this.bass(t, b, i % 8 === 0);
      if (takt % 4 === 3 && (i === 8 || i === 14)) this.stab(t);
      this.schritt++; this.naechste += sech;
    }
    // Die Tür als Filter: draußen dumpf, auf dem Floor offen.
    const f = this.filter.frequency;
    f.setTargetAtTime(S.cutoffZiel, this.ctx.currentTime, 0.28);
  },
};

let M = 1;

/* =====================================================================
   EINLADUNG — Polly spricht aus dem Spiel heraus in die Kamera.
   Gezeichnet wird der echte Grundriss mit der Grafik aus dem Spiel,
   eine durchgehende Kamerafahrt, darunter die Dialogbox.
   ===================================================================== */

const ZEIT = 17.8;
const VOR = 3.50;                 // Karte steht 3 s, dann pixelt sie weg
let T = 0, laeuft = false, start0 = 0;

// Die Mitte des Bildes liegt etwas ueber der Dialogbox
const BANDY = HOCH * 0.45;
let KAM = {x:1300, y:300, z:5.20};

const FAHRT = [
  {t:0.0,  x:1300, y:300, z:5.20},   // dicht bei Polly auf dem Main Floor
  {t:2.8,  x:1300, y:300, z:5.20},
  {t:4.3,  x:862,  y:400, z:0.62},   // raus: der ganze Laden samt Hafen
  {t:7.0,  x:862,  y:392, z:0.635},  // in der Uebersicht ganz leicht weiter rein
  {t:8.3,  x:1320, y:250, z:1.85},   // zurueck auf den Floor
  {t:11.0, x:1320, y:250, z:1.85},
  {t:12.2, x:1600, y:180, z:2.15},   // an die Backstage-Tuer
  {t:17.8, x:1600, y:180, z:2.15},
];
function kamera(t) {
  if (t <= FAHRT[0].t) return {...FAHRT[0]};
  const L = FAHRT[FAHRT.length - 1];
  if (t >= L.t) return {...L};
  let a = FAHRT[0], b = L;
  for (let i = 0; i < FAHRT.length - 1; i++) {
    if (t >= FAHRT[i].t && t <= FAHRT[i+1].t) { a = FAHRT[i]; b = FAHRT[i+1]; break; }
  }
  const u = (t - a.t) / (b.t - a.t);
  const e = u * u * (3 - 2*u);
  // Zoom logarithmisch mischen, sonst zieht die Fahrt am Ende an
  const z = Math.exp(Math.log(a.z) + (Math.log(b.z) - Math.log(a.z)) * e);
  return {x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e, z};
}

function alpha(a, b, ein = 0.25, aus = 0.4) {
  if (T <= a || T >= b) return 0;
  return Math.max(0, Math.min(1, Math.min((T - a) / ein, (b - T) / aus)));
}

/* ---------- Figuren ---------- */
function pollyPos() {
  if (T < 11.4) return {x:1300, y:300};
  const u = Math.max(0, Math.min(1, (T - 11.4) / 2.4));
  const e = u * u * (3 - 2*u);
  return {x: 1300 + (1556 - 1300) * e, y: 300 + (170 - 300) * e};
}

const ZIELE = [[1160, 160], [1460, 150], [1150, 400], [1470, 395]];
function crew() {
  const weg = Math.max(0, Math.min(1, (T - 8.5) / 2.2));
  const e = weg * weg * (3 - 2*weg);
  for (let i = 0; i < 4; i++) {
    const sx = 1300 + (i - 1.5) * 26, sy = 300;
    const hop = Math.abs(Math.sin(T*4.6 + i*1.3)) * (3 + S.puls*5);
    const f = {...CREW[i+1], x: sx + (ZIELE[i][0] - sx) * e,
               y: sy + (ZIELE[i][1] - sy) * e - hop,
               schritt: T*5 + i*2, blick: Math.PI/2, jacke:false};
    figur(f, 1, null);
    if (i === 1 && weg > 0.3 && weg < 0.95) sprechblase(f, "gleich!", "#ffd76e");
  }
}

/* ---------- Die Dialogbox aus dem Spiel ---------- */
function rede(zeilen, t0, t1) {
  const a = Math.min(1, (T - t0) / 0.22) * Math.min(1, (t1 - T) / 0.18);
  if (a <= 0) return;
  const al = Math.max(0, Math.min(1, a));
  const bx = BREIT * 0.055, bw = BREIT * 0.89;
  let gr = 54;
  cx.font = `500 ${gr}px 'Poppins',sans-serif`;
  const breit = Math.max(...zeilen.map(z => cx.measureText(z).width));
  if (breit > bw - 96) gr = Math.floor(gr * (bw - 96) / breit);
  const zh = gr * 1.3;
  const bh = 114 + zeilen.length * zh;
  const by = HOCH * 0.745;
  const ecke = 32;

  cx.save(); cx.globalAlpha = al;
  cx.shadowColor = "rgba(0,0,0,.55)"; cx.shadowBlur = 34; cx.shadowOffsetY = 13;
  const g = cx.createLinearGradient(bx, by, bx + bw*0.45, by + bh);
  g.addColorStop(0, "#ffdca8"); g.addColorStop(0.52, "#f5912f"); g.addColorStop(1, "#e2621c");
  cx.fillStyle = g;
  rundRect(cx, bx, by, bw, bh, ecke); cx.fill();
  cx.restore();

  cx.save(); cx.globalAlpha = al;
  cx.strokeStyle = "rgba(255,243,230,.55)"; cx.lineWidth = 3.5;
  rundRect(cx, bx, by, bw, bh, ecke); cx.stroke();
  cx.fillStyle = "rgba(255,255,255,.45)";
  cx.fillRect(bx + ecke, by + 2, bw - ecke*2, 3);
  cx.textAlign = "left"; cx.textBaseline = "alphabetic";
  cx.font = `400 32px 'Silkscreen',monospace`;
  cx.fillStyle = "#8f2b12";
  cx.fillText("POLLY", bx + 44, by + 56);

  // Buchstabe fuer Buchstabe, schnell
  let rest = Math.floor(Math.max(0, T - t0 - 0.1) / 0.016);
  cx.font = `500 ${gr}px 'Poppins',sans-serif`;
  cx.fillStyle = "#2a0604";
  let fertig = true;
  zeilen.forEach((z, i) => {
    const n = Math.max(0, Math.min(z.length, rest));
    if (n < z.length) fertig = false;
    rest -= z.length;
    cx.fillText(z.slice(0, n), bx + 44, by + 104 + i*zh);
  });
  if (fertig && Math.sin(T * 7) > 0) {
    cx.fillStyle = "#8f2b12";
    cx.beginPath();
    cx.moveTo(bx + bw - 62, by + bh - 42);
    cx.lineTo(bx + bw - 38, by + bh - 30);
    cx.lineTo(bx + bw - 62, by + bh - 18);
    cx.closePath(); cx.fill();
  }
  cx.restore();
}

/* Eine Zeile, die sich von selbst kleiner macht, wenn sie zu breit wird */
function mittig(c, txt, y, gr, dick, silk, farbe, dickeKante) {

}

/* Die Karte vor dem Film. Sie wird auf ein eigenes Bild gemalt,

const karteCv = document.createElement("canvas");

function karteMalen(tr) {
  const c = kcx;

  const g = c.createRadialGradient(BREIT/2, HOCH*0.44, 60, BREIT/2, HOCH*0.44, BREIT*1.15);

  const f2 = 1 + Math.sin(tr * 3.4) * 0.14;
  funkel(c, BREIT*0.112, HOCH*0.378, 38*f2, 0.25, "#fff5dc");
  funkel(c, BREIT*0.888, HOCH*0.378, 38*f2, -0.25, "#fff5dc");
  mittig(c, "RES NULLIUS × GLIMMER", HOCH*0.492, 60, "800", false, "#ffd27a", 0.18);
  mittig(c, "MIT FORMULA.303 UND SERA J", HOCH*0.552, 32, "400", true, "rgba(255,243,230,.92)", 0.3);
  mittig(c, "24.10.", HOCH*0.645, 76, "800", false, "#fb9e03", 0.18);
  mittig(c, "IM NEUEN CLUB GLIMMER", HOCH*0.706, 30, "400", true, "rgba(255,243,230,.88)", 0.3);
  mittig(c, "STOCKMEYERSTRASSE 43", HOCH*0.746, 30, "400", true, "rgba(255,243,230,.88)", 0.3);
  c.textAlign = "left";
}

function vorspann(tr) {
  const steht = 3.0, zerfall = 0.5;          // steht, dann pixelt sie weg
  if (tr <= 0 || tr >= steht + zerfall) return;
  karteMalen(tr);
  const ein = Math.min(1, tr / 0.22);
  const pz = Math.max(0, (tr - steht) / zerfall);
  cx.save();
  cx.globalAlpha = Math.max(0, Math.min(1, ein * (1 - pz * pz)));
  if (pz <= 0) {
    cx.drawImage(karteCv, 0, 0, BREIT, HOCH);
  } else {
    // Ueber ein schrumpfendes Zwischenbild: je weiter, desto groeber die Kloetzchen
    const w  = Math.max(2, Math.round(170 * Math.pow(1 - pz, 2.2)));
    const hh = Math.max(2, Math.round(w * HOCH / BREIT));
    pixelCv.width = w; pixelCv.height = hh;
    const pc = pixelCv.getContext("2d");
    pc.imageSmoothingEnabled = false;
    pc.drawImage(karteCv, 0, 0, w, hh);
    cx.imageSmoothingEnabled = false;
    cx.drawImage(pixelCv, 0, 0, BREIT, HOCH);
    cx.imageSmoothingEnabled = true;
  }
  cx.restore();
}

function kopf() {
  const a = alpha(0.25, 14.7, 0.4, 0.4); if (!a) return;
  cx.save(); cx.globalAlpha = a; cx.textAlign = "center"; cx.lineJoin = "round";
  cx.font = `400 40px 'Silkscreen',monospace`;
  cx.strokeStyle = "rgba(20,4,2,.8)"; cx.lineWidth = 13;
  cx.strokeText("POCKET GLIMMER", BREIT/2, HOCH*0.115);
  cx.fillStyle = "#fff6e4";
  cx.fillText("POCKET GLIMMER", BREIT/2, HOCH*0.115);
  cx.restore(); cx.textAlign = "left";
}

/* Schlussmarke: nur der Name und wo es liegt, mehr nicht */
function schluss() {
  const a = alpha(14.8, ZEIT + 9, 0.45, 0.4); if (!a) return;
  cx.save(); cx.globalAlpha = a;
  cx.fillStyle = "rgba(20,4,2,.76)"; cx.fillRect(0, 0, BREIT, HOCH);
  cx.textAlign = "center"; cx.lineJoin = "round";
  cx.font = `400 74px 'Silkscreen',monospace`;
  cx.strokeStyle = "rgba(20,4,2,.9)"; cx.lineWidth = 20;
  cx.strokeText("POCKET", BREIT/2, HOCH*0.45);
  cx.strokeText("GLIMMER", BREIT/2, HOCH*0.545);
  cx.fillStyle = "#fff6e4";
  cx.fillText("POCKET", BREIT/2, HOCH*0.45);
  cx.fillText("GLIMMER", BREIT/2, HOCH*0.545);
  const f2 = 1 + Math.sin(T * 2.4) * 0.14;
  funkel(cx, BREIT*0.19, HOCH*0.425, 40*f2, 0.25, "#fff5dc");
  funkel(cx, BREIT*0.81, HOCH*0.47, 32*f2, -0.35, "#fff5dc");
  cx.font = `800 62px 'Poppins',sans-serif`;
  cx.strokeStyle = "rgba(20,4,2,.9)"; cx.lineWidth = 14;
  cx.strokeText("Link in Bio", BREIT/2, HOCH*0.645);
  cx.fillStyle = "#ffd27a";
  cx.fillText("Link in Bio", BREIT/2, HOCH*0.645);
  cx.textAlign = "left";
  cx.restore();
}

/* ---------- Ablauf ---------- */
function bild() {
  requestAnimationFrame(bild);
  if (!laeuft) return;
  const TROH = (performance.now() - start0) / 1000;
  T = TROH - VOR;                   // die Szenen fangen erst nach der Karte an
  S.t = T;
  S.puls = Math.max(0, S.puls - 0.055);
  S.cutoffZiel = T < 0.3 ? 420 : T < 14.7 ? 19000 : 2600;
  Ton.tick();
  KAM = kamera(T);

  const dpr = cv.width / (BREIT * M);
  cx.setTransform(M * dpr, 0, 0, M * dpr, 0, 0);
  cx.clearRect(0, 0, BREIT, HOCH);
  cx.fillStyle = "#1c0b06"; cx.fillRect(0, 0, BREIT, HOCH);
  cx.textBaseline = "alphabetic";

  // Ab hier in Weltkoordinaten: genau die Grafik aus dem Spiel
  cx.save();
  cx.translate(BREIT/2, BANDY);
  cx.scale(KAM.z, KAM.z);
  cx.translate(-KAM.x, -KAM.y);

  welt();

  // Sera J und Formula.303 warten im Backstage
  if (T > 7.0) {
    const dj = {haar:"#3d2c1f", haut:"#f0cba6", fit:"#2a1030", hose:"#1d1030",
                akz:"#6cf5b4", augen:"#3a2a1a", lippen:"#8a4a28", stil:"buzz",
                acc:["kopfhoerer"], mann:true, x:1600, y:150,
                schritt: T*1.1, blick: Math.PI/2, jacke:false};
    figur(dj, 1, "#6cf5b4");
    figur({...dj, haar:"#fbf7ff", haut:"#c98d63", mann:false, stil:"kurz",
           akz:"#ffd76e", acc:["visor"], x:1648, y:200, schritt: T*1.4}, 1, "#ffd76e");
  }

  if (T > 8.2 && T < 11.4) crew();

  const pp = pollyPos();
  const po = {...CREW[0], x: pp.x, y: pp.y - Math.abs(Math.sin(T*3.1)) * 2,
              schritt: T*4.2, blick: 0, jacke:false};
  figur(po, 1, "#ff9f45");
  if (T > 9.2 && T < 11.3) {                // der Ruf, wie im Spiel
    const r = ((T - 9.2) % 1.0) / 1.0;
    cx.strokeStyle = `rgba(255,150,64,${(1-r)*0.75})`;
    cx.lineWidth = 3 / KAM.z;
    cx.beginPath(); cx.arc(po.x, po.y, 12 + r*210, 0, 7); cx.stroke();
  }
  cx.restore();

  kopf();
  rede(["Hey. Polly hier."], 0.4, 2.9);
  rede(["Das ist der neue Hamburger", "Club Glimmer. Echt nachgebaut",
        "und zu einem Game gemacht."], 3.0, 7.2);
  rede(["Hilf mir, mich und meine", "Freundinnen ins Backstage",
        "zu bekommen."], 7.4, 11.3);
  rede(["Die Schnellsten gewinnen", "Karten für den 24.10."], 11.5, 14.6);
  schluss();
  vorspann(TROH);

  if (T >= ZEIT) {
    laeuft = false;
    document.getElementById("nochmal").classList.add("da");
  }
}

function ab() {
  document.getElementById("start").hidden = true;
  document.getElementById("nochmal").classList.remove("da");
  Ton.start();
  groesse();
  start0 = performance.now(); T = 0; laeuft = true;
}
document.getElementById("ab").addEventListener("click", ab);
document.getElementById("nochmal").addEventListener("click", ab);
requestAnimationFrame(bild);
})();

</script>
